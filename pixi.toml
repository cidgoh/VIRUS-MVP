[workspace]
channels = ["conda-forge", "bioconda"]
name = "VIRUS-MVP"
platforms = ["osx-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
# Bioconda: Nextflow syntax parser v1 (legacy) by default
nextflow = "==25.10.4"
# pkg_resources is required (use older version of setuptools)
setuptools = "==81.0.0"

[pypi-dependencies]
dash = "==1.20.0"
plotly = "==5.24.1"
numpy = "==1.26.4"
dash-bootstrap-components = "==0.11.3"
flask-caching = "==1.10.1"
gunicorn = "==20.1.0"
werkzeug = "==2.0.2"
