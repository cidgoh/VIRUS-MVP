[project]
name = "VIRUS-MVP"
requires-python = "==3.11.*"
dependencies = [
    "dash == 1.20.0",
    "dash-bootstrap-components == 0.11.3",
    "flask-caching == 1.10.1",
    "gunicorn == 20.1.0",
    "numpy == 1.26.4",
    "plotly == 5.24.1",
    "werkzeug == 2.0.2",
]

[build-system]
requires = ["setuptools == 81.0.0"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = [
    "linux-64",
    "linux-aarch64",
    "osx-64",
    "osx-arm64",
]

[tool.pixi.dependencies]
python = "3.11.*"
# pkg_resources is required
setuptools = "==81.0.0"
# Nextflow syntax parser v1 (legacy) is required
nextflow = "==25.10.4"
ca-certificates = ">=2026.5.20,<2027"

[tool.pixi.pypi-dependencies]
virus_mvp = { path = ".", editable = true }

[tool.pixi.tasks]
