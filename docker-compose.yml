version: '3'

services:
  app:
    tty: true
    container_name: virus_mvp_app
    build:
      context: .
      dockerfile: ./dockerConf/Dockerfile
      args:
        WORKDIR: $PWD
    image: virus_mvp_app
    ports:
      - "80:8050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - $PWD/nf-ncov-voc:$PWD/nf-ncov-voc
      - ./reference_data:$PWD/reference_data
      - ./reference_surveillance_reports:$PWD/reference_surveillance_reports
      - ./user_data:$PWD/user_data
      - ./user_surveillance_reports:$PWD/user_surveillance_reports
      # - /var/run/docker.sock:/var/run/docker.sock
      # - ./nf-ncov-voc:/home/ubuntu/VIRUS-MVP/nf-ncov-voc
      # - ./reference_data:/home/ubuntu/VIRUS-MVP/reference_data
      # - ./reference_surveillance_reports:/home/ubuntu/VIRUS-MVP/reference_surveillance_reports
      # - ./user_data:/home/ubuntu/VIRUS-MVP/user_data
      # - ./user_surveillance_reports:/home/ubuntu/VIRUS-MVP/user_surveillance_reports
